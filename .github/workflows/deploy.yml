name: 🚀 Deploy Laravel App (CD)

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    name: 🔄 Auto Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the latest code
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      # 2. Setup SSH agent using your private key
      - name: 🔐 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3. Dynamically trust the VPS fingerprint
      - name: 🧾 Add server to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

      # 4. Upload deploy.sh script
      - name: 📤 Upload deploy.sh to VPS
        run: |
          echo "Uploading deploy.sh..."
          scp deploy.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/root/deploy.sh
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "chmod +x /root/deploy.sh"

      # 5. Run deploy.sh on the server
      - name: 🚀 Execute deploy.sh
        run: |
          echo "Running deployment..."
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "bash /root/deploy.sh"
